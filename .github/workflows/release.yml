name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # CounterStrikeSharp.API 1.0.371 ships a net10.0 assembly only.
          dotnet-version: 10.0.x

      - name: Check tag matches ModuleVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          module_version="$(grep -oP 'ModuleVersion => "\K[^"]+' ChatControl/ChatControl.cs)"

          if [ "$tag_version" != "$module_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match ModuleVersion $module_version in ChatControl.cs" >&2
            exit 1
          fi

      - name: Build
        run: dotnet publish ChatControl -c Release -o publish

      - name: Package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi

          # Zip layout matches the install path: extract into
          # game/csgo/addons/counterstrikesharp/plugins/ and you're done.
          mkdir -p package/ChatControl
          cp publish/ChatControl.dll publish/ChatControl.deps.json package/ChatControl/
          (cd package && zip -r "../ChatControl-${version}.zip" ChatControl)

          echo "ZIP_NAME=ChatControl-${version}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatControl
          path: package/ChatControl

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
            --title "ChatControl $GITHUB_REF_NAME" \
            --generate-notes
